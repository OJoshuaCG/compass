name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos mínimos: el pipeline solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Las acciones se fijan por SHA de commit, no por etiqueta (plan: "CI/CD").
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # La versión de pnpm sale de `packageManager` en package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint, boundaries, dependency-cruiser)
        run: pnpm lint

      # Las pruebas de integración usan Testcontainers: el runner ya trae Docker.
      - name: Test (unit and integration, real PostgreSQL)
        run: pnpm test

      # Navegador real (Chrome del runner) contra la plataforma completa: PostgreSQL en contenedor,
      # la API sirviendo la SPA en el mismo origen, con la CSP estricta y la cookie de sesión.
      - name: Browser end-to-end tests
        run: pnpm e2e
