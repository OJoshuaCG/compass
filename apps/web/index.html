<!doctype html>
<!-- Sin <script> ni <style> en línea: compatible con la CSP estricta (script-src 'self'). -->
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <!-- Color de la barra del navegador móvil; applyTheme lo actualiza al cambiar de tema. -->
    <meta name="theme-color" content="#0b0f13" />
    <!-- El token de invitación puede viajar en la URL: sin Referer no se filtra a otros sitios. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/svg/compass-icon-app-dark.svg" />
    <title>Compass</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
